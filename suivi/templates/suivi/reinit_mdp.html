{% extends "suivi/base.html" %}
{% block titre %}Réinitialiser le mot de passe{% endblock %}
{% block contenu %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h4 class="mb-3">Mot de passe oublié</h4>
            <p class="text-muted">Saisissez votre adresse email. Un lien de réinitialisation vous sera envoyé.</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required autofocus>
                </div>
                <button type="submit" class="btn btn-dark w-100">Envoyer le lien</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'connexion' %}">Retour à la connexion</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
